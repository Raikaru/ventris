[workspace]
resolver = "3"
members = [
    "crates/ventris-addr",
    "crates/ventris-db",
    "crates/ventris",
    "crates/ventris-decompiler",
    "crates/ventris-format",
    "crates/ventris-gen",
    "crates/ventris-log",
    "crates/ventris-pcode",
    "crates/ventris-sleigh",
    "crates/ventris-target",
    "crates/ventris-lifter",
    "crates/ventris-game",
    "crates/ventris-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.3.0"
 license = "Apache-2.0"
repository = "https://github.com/Raikaru/ventris"

# Third-party crates stay behind the stage that owns them. `ventris-sleigh`
# depends on pure-Rust `miniz_oxide` solely for Ghidra's zlib-compressed SLA
# container; higher analysis and public facade crates do not inherit it.
