name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release metadata
        run: python -S tools/release_check.py --version 0.1.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Validate package archives
        run: cargo package --workspace --allow-dirty --locked
  gpui:
    name: GPUI desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check GPUI formatting
        run: cargo fmt --manifest-path desktop/ventris-gpui/Cargo.toml -- --check
      - name: Run GPUI tests
        run: cargo test --manifest-path desktop/ventris-gpui/Cargo.toml --locked

  python:
    name: Python (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python tests
        env:
          PYTHONPATH: python
        run: python -S -m unittest discover -s python/tests
      - name: Build Python wheel
        run: python -m pip wheel . --no-deps --no-cache-dir --wheel-dir dist
      - name: Verify Python wheel payload
        run: python -S tools/verify_python_artifact.py --wheel dist/ventris_client-0.1.0-py3-none-any.whl --version 0.1.0

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        working-directory: integrations/vscode
        run: npm ci
      - name: Audit runtime dependency tree
        working-directory: integrations/vscode
        run: npm audit --omit=dev --audit-level=high
      - name: Build VSIX
        working-directory: integrations/vscode
        run: npm run package
      - name: Verify VSIX payload
        run: python -S tools/verify_vsix.py --vsix integrations/vscode/dist/ventris-binary-analysis-0.1.0.vsix --version 0.1.0
