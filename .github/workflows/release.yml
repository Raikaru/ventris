name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: ventris
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: ventris.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: ventris
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release metadata
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          python -S tools/release_check.py --version "$version"
      - name: Build native executable
        run: cargo build --release --locked -p ventris-cli --target ${{ matrix.target }}
      - name: Smoke-test native executable
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          python -S tools/native_smoke.py \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --fixture "integrations/vscode/acceptance/fixture.exe" \
            --semantic-spec "integrations/vscode/acceptance/semantic.json" \
            --version "$version"
      - name: Smoke-test from clean working directory
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          python -S tools/clean_host_smoke.py \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --fixture "integrations/vscode/acceptance/fixture.exe" \
            --semantic-spec "integrations/vscode/acceptance/semantic.json" \
            --version "$version"
      - name: Smoke-test HTTP boundary
        shell: bash
        run: |
          python -S tools/http_smoke.py \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Package native archive
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          mkdir -p dist
          python -S tools/package_release.py \
            --version "$version" \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --output "dist/ventris-${version}-${{ matrix.target }}.${{ matrix.archive }}"
          python -S tools/verify_release_archive.py \
            --archive "dist/ventris-${version}-${{ matrix.target }}.${{ matrix.archive }}" \
            --version "$version" \
            --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  gpui:
    name: GPUI desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check GPUI formatting
        run: cargo fmt --manifest-path desktop/ventris-gpui/Cargo.toml -- --check
      - name: Run GPUI tests
        run: cargo test --manifest-path desktop/ventris-gpui/Cargo.toml --locked

  python:
    name: Python package
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64-unknown-linux-gnu
          path: native
      - name: Extract paired native executable
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          mkdir -p native/extracted
          tar -xzf "native/ventris-${version}-x86_64-unknown-linux-gnu.tar.gz" -C native/extracted
      - name: Run Python tests
        env:
          PYTHONPATH: python
        run: python -S -m unittest discover -s python/tests
      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --sdist --outdir dist
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          test -f "dist/ventris_client-${version}-py3-none-any.whl"
          test -f "dist/ventris_client-${version}.tar.gz"
          python -S tools/verify_python_artifact.py \
            --wheel "dist/ventris_client-${version}-py3-none-any.whl" \
            --version "$version"
          python -S tools/verify_python_source.py \
            --source "dist/ventris_client-${version}.tar.gz" \
            --version "$version"
      - name: Smoke-test clean Python installation with native pair
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --no-deps "dist/ventris_client-${version}-py3-none-any.whl"
          VENTRIS_BIN="$PWD/native/extracted/ventris-${version}-x86_64-unknown-linux-gnu/ventris" \
            .release-venv/bin/python -c "from ventris import version; print(version())"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  vscode:
    name: VS Code VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        working-directory: integrations/vscode
        run: npm ci
      - name: Audit runtime dependency tree
        working-directory: integrations/vscode
        run: npm audit --omit=dev --audit-level=high
      - name: Build VSIX
        working-directory: integrations/vscode
        run: npm run package
      - name: Verify VSIX payload
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          python -S tools/verify_vsix.py \
            --vsix "integrations/vscode/dist/ventris-binary-analysis-${version}.vsix" \
            --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: integrations/vscode/dist/*.vsix
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [native, python, vscode, gpui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          release_flags=()
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_flags+=(--verify-tag)
          fi
          gh release create "v${version}" artifacts/* \
            "${release_flags[@]}" \
            --title "Ventris ${version}" \
            --generate-notes
